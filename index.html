<!DOCTYPE html><html lang="fr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notre petit univers ❤️</title>

<style>
    body {
        background: #160d18;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 30px 15px;
    }

    h1 {
        color: #ff6b91;
        margin-top: 70px;
    }

    p {
        font-size: 18px;
        line-height: 1.6;
    }

    button {
        background: #ff477e;
        color: white;
        border: none;
        padding: 15px 25px;
        border-radius: 25px;
        font-size: 17px;
        margin-top: 25px;
    }

    #message {
        display: none;
        margin-top: 30px;
        color: #ffb6c9;
    }
</style>

</head><body><h1>Bienvenue dans notre univers ❤️</h1>

<p>
    Il existe des personnes qui rendent la vie
    plus belle simplement par leur présence.
</p>

<button onclick="document.getElementById('message').style.display='block'">
    Clique ici ❤️
</button>

<div id="message">
    <h2>Une petite surprise 💌</h2>

    <p>
        Peu importe la distance, certaines personnes
        gardent toujours une place spéciale dans notre cœur.
    </p>
</div>

</body>
</html>
